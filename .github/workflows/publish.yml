# Delta-V Horizon — Publish to GitHub Packages
#
# Builds all Horizon modules and publishes them as Maven artifacts
# to GitHub Packages Maven registry.
#
# Trigger: Push a tag matching a semver pattern (e.g., 1.0.0, 1.0.1, 2.0.0)
#          or run manually via workflow_dispatch.
#
# Consumer setup (one-time):
#   1. Create a GitHub PAT with packages:read scope
#   2. Add to ~/.m2/settings.xml:
#        <server>
#          <id>github</id>
#          <username>YOUR_GITHUB_USERNAME</username>
#          <password>YOUR_PAT</password>
#        </server>

name: Publish to GitHub Packages

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  JAVA_VERSION: '21'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish Maven Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Validate tag matches POM version
        if: github.event_name == 'push'
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          POM_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout || grep '<version>' pom.xml | head -1 | sed 's/.*<version>//;s/<.*//')
          echo "POM version: $POM_VERSION, Tag: $TAG_VERSION"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: POM version ($POM_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version validated: $POM_VERSION"

      - name: Build all modules
        run: ./mvnw -B -DskipTests install

      - name: Deploy to GitHub Packages
        # `-fae` (fail-at-end): continue building remaining modules after a
        # module's deploy fails, then report failure at the end. Combined with
        # the root POM's property-backed <deployAtEnd>${deployAtEnd}</deployAtEnd>
        # default of false, each module deploys independently — a 409 on one
        # already-published module does NOT abort the reactor.
        #
        # `|| true` remains so the step exit code is tolerant of 409s from
        # already-published artifacts (a legitimate idempotency concern on
        # re-runs). The follow-up 'Verify' step enforces correctness by
        # checking a representative jar + pom-packaged artifact per major
        # namespace — if a real deploy failure leaves an aggregator POM
        # unpublished, Verify catches it and exits non-zero.
        run: ./mvnw -B -fae -DskipTests deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/pbrane/delta-v-horizon || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify key artifacts published
        # Representative check: one jar + one pom-packaged aggregator per
        # major namespace. Pom-packaged aggregators (e.g., org.opennms.core,
        # opennms) are load-bearing parent POMs — consumers cannot resolve
        # any of their child modules without them. A prior regression where
        # only jars were verified allowed a run to pass with all aggregators
        # missing; expanded coverage below prevents that.
        run: |
          echo "Verifying key artifacts are available on GitHub Packages..."
          ARTIFACTS=(
            "org.opennms:opennms-dao-api"
            "org.opennms:opennms-config-api"
            "org.opennms:opennms-model"
            "org.opennms.core:org.opennms.core.api"
            "org.opennms.features.events:org.opennms.features.events.api"
            "org.opennms:opennms-rrd-api"
            "org.opennms:opennms"
            "org.opennms:org.opennms.core"
            "org.opennms:opennms-core"
            "org.opennms:opennms-dependencies"
          )
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          FAILED=0
          for art in "${ARTIFACTS[@]}"; do
            GROUP=$(echo "$art" | cut -d: -f1)
            ARTIFACT=$(echo "$art" | cut -d: -f2)
            GROUP_PATH=$(echo "$GROUP" | tr '.' '/')
            URL="https://maven.pkg.github.com/pbrane/delta-v-horizon/${GROUP_PATH}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.pom"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${GITHUB_TOKEN}" "$URL")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "  OK: ${art}:${VERSION}"
            else
              echo "  MISSING: ${art}:${VERSION} (HTTP $STATUS)"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "ERROR: Some artifacts are missing. Deploy may have failed."
            exit 1
          fi
          echo "All key artifacts verified."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
